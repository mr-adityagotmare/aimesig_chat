name: Aimapp
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  
  flutter_launcher_icons: ^0.14.3

  # State management
  provider: ^6.1.2
  file_picker: ^8.0.0
  open_filex: ^4.7.0
  path_provider: ^2.1.0   # already likely present, but confirm

  # Database
  sqflite: ^2.3.2
  sqflite_common_ffi: ^2.3.3      # Linux + Windows SQLite via FFI


  # Utilities
  path: ^1.9.0
  uuid: ^4.4.0
  crypto: ^3.0.3                  # SHA-256 for stable device ID
  shared_preferences: ^2.2.3

  # Network info (optional, for display only)
  network_info_plus: ^5.0.3
  connectivity_plus: ^6.0.3
  socket_io_client: ^2.0.3+1

  # Permissions (mobile only — safe to include on desktop, just unused)
  permission_handler: ^11.3.1
  flutter_webrtc: ^1.3.1
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  google_sign_in: ^6.2.0
  cloud_firestore: ^5.0.0

  

dependency_overrides:
  sqlite3: ^2.4.6        # pin to a version that has lib/open.dart
  sqflite_common_ffi: ^2.3.3


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"

  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256

  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

  linux:
    generate: true
    image_path: "assets/icon/app_icon.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true